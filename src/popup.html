<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explain This</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2330; --muted: #6b7280;
      --brand: #6366F1; --brand2: #8B5CF6; --line: rgba(0,0,0,.08);
      --field: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1e27; --fg: #e6e8ee; --muted: #9aa0ad; --line: rgba(255,255,255,.08); --field: #262a35; }
    }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; background: var(--bg); color: var(--fg);
      font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    header .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--brand), var(--brand2));
      display: grid; place-items: center; color: #fff; flex: none; }
    header h1 { font-size: 14px; margin: 0; font-weight: 700; }
    header .sub { font-size: 11px; color: var(--muted); font-weight: 400; }
    .search { display: flex; gap: 8px; padding: 12px 14px; }
    .search input { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
      background: var(--field); color: var(--fg); font: inherit; }
    .search input:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
    .search button { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 9px; color: #fff; font-weight: 700;
      background: linear-gradient(135deg, var(--brand), var(--brand2)); }
    .search button:active { transform: scale(.97); }
    #result { padding: 0 14px 14px; min-height: 20px; }
    .term { font-size: 16px; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .phon { font-weight: 400; font-size: 13px; color: var(--muted); }
    .desc { font-size: 12px; color: var(--muted); text-transform: capitalize; margin-bottom: 6px; }
    .pos { font-style: italic; color: var(--brand); font-size: 12px; margin-top: 8px; }
    ul.defs { margin: 4px 0 0; padding-left: 18px; } ul.defs li { margin: 2px 0; }
    .thumb { float: right; width: 80px; border-radius: 8px; margin: 0 0 8px 10px; }
    .more { display: inline-block; margin-top: 10px; color: var(--brand); text-decoration: none; font-weight: 600; font-size: 13px; }
    .more:hover { text-decoration: underline; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
    .b-glossary { background: #ecfdf5; color: #059669; } .b-dict { background: #eff6ff; color: #2563eb; } .b-wiki { background: #f5f3ff; color: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .b-glossary { background: rgba(5,150,105,.18); color: #34d399; } .b-dict { background: rgba(37,99,235,.18); color: #60a5fa; } .b-wiki { background: rgba(124,58,237,.2); color: #c4b5fd; }
    }
    .muted { color: var(--muted); } .error { color: #b91c1c; } @media (prefers-color-scheme: dark){ .error{ color:#f87171; } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(99,102,241,.3); border-top-color: var(--brand);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    footer a { color: var(--brand); text-decoration: none; cursor: pointer; } footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="logo">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.74c.6.43 1 .97 1 1.76h6c0-.79.4-1.33 1-1.76A7 7 0 0 0 12 2zm0 2a5 5 0 0 1 2.9 9.06c-.6.43-1.08 1-1.36 1.69h-3.08c-.28-.69-.76-1.26-1.36-1.69A5 5 0 0 1 12 4z"/></svg>
    </span>
    <div>
      <h1>Explain This</h1>
      <div class="sub">Type a word or phrase — or select text on any page.</div>
    </div>
  </header>

  <form class="search" id="form">
    <input id="q" type="text" placeholder="e.g. EBITDA, i.e., photosynthesis…" autocomplete="off" autofocus>
    <button type="submit">Explain</button>
  </form>

  <div id="result"></div>

  <footer>
    <span>Offline-first · private</span>
    <a id="openOptions">Settings</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
